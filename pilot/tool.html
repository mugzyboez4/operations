<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>RCA US Pilot — Campaign Ops Version</title>
<link rel="icon" href="../tempoicon.png">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Inter',Roboto,Helvetica,Arial,sans-serif;color:#1d1f25;background:#fff;display:flex;flex-direction:column;overflow:hidden}
/* ── top bar ─────────────────────────── */
.top{height:48px;flex:0 0 48px;display:flex;align-items:center;gap:12px;padding:0 14px;border-bottom:1px solid #e5e6ea;background:#fff;z-index:10}
.appicon{width:26px;height:26px;border-radius:6px;background:linear-gradient(135deg,#CDF851,#8BBf1d);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;color:#0F0E0E;flex-shrink:0}
.bname{font-size:15px;font-weight:675;letter-spacing:-.01em;white-space:nowrap}
.btag{font-size:11px;font-weight:600;color:#616670;background:#f2f2f4;border:1px solid #e5e6ea;border-radius:99px;padding:3px 10px;white-space:nowrap}
.top .sp{flex:1}
.avs{display:flex}
.av{width:26px;height:26px;border-radius:50%;border:2px solid #fff;margin-left:-8px;font-size:10px;font-weight:700;color:#fff;display:flex;align-items:center;justify-content:center}
.share{background:#166ee1;color:#fff;font-size:13px;font-weight:600;border:none;border-radius:6px;padding:7px 14px;cursor:default}
/* ── layout ──────────────────────────── */
.wrap{flex:1;display:flex;min-height:0}
.side{width:248px;flex:0 0 248px;background:#fbfbfc;border-right:1px solid #e5e6ea;overflow-y:auto;padding:10px 8px 16px;display:flex;flex-direction:column}
.grp{margin-bottom:14px}
.glab{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#8a8f9a;padding:6px 10px 4px}
.tab{display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:none;border:none;font-family:inherit;font-size:13px;font-weight:500;color:#3b3e46;padding:7px 10px;border-radius:6px;cursor:pointer;line-height:1.2}
.tab:hover{background:#eeeff2}
.tab.on{background:#e8f0fe;color:#166ee1;font-weight:600}
.tab svg{width:15px;height:15px;flex-shrink:0;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;opacity:.75}
.tab.on svg{opacity:1}
.sfoot{margin-top:auto;padding:14px 10px 4px;border-top:1px solid #e9eaee}
.sfoot a{font-size:11.5px;color:#8a8f9a;text-decoration:none}
.sfoot a:hover{color:#166ee1}
.sfoot .mk{font-size:10.5px;color:#b0b4bd;line-height:1.5;margin-top:6px}

/* ── tour ── */
.tourb{background:#fff;color:#166ee1;font-size:13px;font-weight:600;border:1px solid #c9dcf8;border-radius:6px;padding:6px 12px;cursor:pointer;font-family:inherit}
.tourb:hover{background:#e8f0fe}
.tcard{position:absolute;right:24px;bottom:24px;width:350px;max-width:calc(100% - 48px);background:#fff;border:1px solid #e5e6ea;border-radius:10px;box-shadow:0 12px 40px rgba(15,14,14,.18);padding:18px 18px 14px;z-index:50;font-size:13px;line-height:1.55;color:#3b3e46;display:none}
.tcard.on{display:block}
.tcard.pulse{animation:tpulse .35s ease}
@keyframes tpulse{from{transform:translateY(10px);opacity:.3}to{transform:none;opacity:1}}
.tcard h3{font-size:14px;font-weight:700;color:#1d1f25;margin-bottom:6px;padding-right:22px}
.tcard .tx{margin-bottom:12px}
.tcard .row{display:flex;align-items:center;gap:10px}
.tcard .n{background:#166ee1;color:#fff;border:none;border-radius:6px;font-size:13px;font-weight:600;padding:7px 14px;cursor:pointer;font-family:inherit}
.tcard .n:hover{background:#1257b8}
.tcard .bk{background:none;border:none;color:#8a8f9a;font-size:12.5px;cursor:pointer;font-family:inherit;padding:0}
.tcard .ct{margin-left:auto;font-size:11px;color:#b0b4bd}
.tcard .x{position:absolute;top:8px;right:10px;background:none;border:none;font-size:16px;line-height:1;color:#b0b4bd;cursor:pointer;font-family:inherit}
/* ── main ────────────────────────────── */
.main{flex:1;min-width:0;position:relative;background:#fff}
.main iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.load{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#fff;font-size:13px;color:#8a8f9a;pointer-events:none;opacity:0;transition:opacity .15s}
.load.on{opacity:1}
@media(max-width:760px){.side{width:200px;flex-basis:200px}}
</style>
</head>
<body>

<div class="top">
  <div class="appicon">R</div>
  <div class="bname">RCA US Pilot</div>
  <div class="btag">Campaign Ops version · mockup</div>
  <div class="sp"></div>
  <div class="avs">
    <div class="av" style="background:#0F0E0E">M</div>
    <div class="av" style="background:#FF4A23">G</div>
    <div class="av" style="background:#166ee1">C</div>
  </div>
  <button class="tourb" id="tourb">Take the tour</button>
  <button class="share">Share</button>
</div>

<div class="wrap">
  <nav class="side">
    <div class="grp">
      <div class="glab">Artists</div>
      <button class="tab" data-page="artist"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.5-6 8-6s8 2 8 6"/></svg>Artist Page</button>
    </div>
    <div class="grp">
      <div class="glab">Library</div>
      <button class="tab" data-page="releases"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="2.5"/></svg>Releases</button>
      <button class="tab" data-page="projects"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="5" height="16" rx="1"/><rect x="10" y="4" width="5" height="10" rx="1"/><rect x="17" y="4" width="4" height="13" rx="1"/></svg>Campaigns</button>
      <button class="tab" data-page="upcoming"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Upcoming</button>
      <button class="tab" data-page="assets"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M3 17l6-5 5 4 3-2 4 3"/></svg>Assets</button>
    </div>
    <div class="grp">
      <div class="glab">Executive</div>
      <button class="tab" data-page="scheduling"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>Scheduling</button>
    </div>
    <div class="grp">
      <div class="glab">Streaming</div>
      <button class="tab" data-page="dsp-pitches"><svg viewBox="0 0 24 24"><path d="M9 18V6l11-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="17.5" cy="16" r="2.5"/></svg>DSP Pitches</button>
    </div>
    <div class="grp">
      <div class="glab">Reference</div>
      <button class="tab" data-page="artist-build-template"><svg viewBox="0 0 24 24"><path d="M7 3h8l4 4v14H7z"/><path d="M15 3v4h4M10 12h6M10 16h6"/></svg>Build Template</button>
    </div>
    <div class="sfoot">
      <a href="index.html">About these mockups →</a>
      <div class="mk">Campaign Ops · not connected to the live base · sample data</div>
    </div>
  </nav>

  <div class="main">
    <iframe id="frame" title="page" src="about:blank"></iframe>
    <div class="load" id="load">Loading…</div>
    <div class="tcard" id="tcard">
      <button class="x" id="tx_close" aria-label="Close tour">×</button>
      <h3 id="tt"></h3>
      <div class="tx" id="ttx"></div>
      <div class="row">
        <button class="n" id="tnext">Next →</button>
        <button class="bk" id="tback">Back</button>
        <span class="ct" id="tct"></span>
      </div>
    </div>

  </div>
</div>

<script>
(function(){
  var frame=document.getElementById('frame'),load=document.getElementById('load');
  var tabs=Array.prototype.slice.call(document.querySelectorAll('.tab'));
  function show(p,push){
    var t=tabs.filter(function(n){return n.getAttribute('data-page')===p})[0];
    if(!t){p='artist';t=tabs[0];}
    tabs.forEach(function(n){n.classList.toggle('on',n===t);});
    load.classList.add('on');
    frame.src=p+'.html';
    if(push!==false){try{history.replaceState(null,'','#'+p);}catch(e){}}
  }
  frame.addEventListener('load',function(){load.classList.remove('on');});
  tabs.forEach(function(n){n.addEventListener('click',function(){show(n.getAttribute('data-page'));});});
  window.addEventListener('hashchange',function(){show(location.hash.replace('#',''),false);});
  show(location.hash.replace('#','')||'artist',false);
})();
</script>

<script>
(function(){
  var steps=[
    {tab:'artist',title:'Welcome — the pilot, our way',text:'Same base, same tabs — every page re-imagined by Campaign Ops. All sample data (a mock Steve Lacy campaign), not connected to the live base. This tour clicks through each tab for you.'},
    {tab:'artist',title:'Artist Page — the anchor',text:'The top layer answers “what do I need to know right now”: a Latest hero, a What’s-Changing feed with a caught-up marker, and the newest release pinned. Everything else is collapsed below — click into Team, Releases, Campaigns, Assets — and sections drag into any order.'},
    {tab:'releases',title:'Releases — week slices, not a 1,400-row table',text:'Same records, grouped by release week, cut into content-type slices (track / album / physical / video) with at-a-glance indicators for focus tracks, delivery status, and confidential titles. Modeled on Release Runway.'},
    {tab:'projects',title:'Campaigns (renamed from Projects)',text:'Grouped by status, with auto-created creative tickets flagged — so the queue stays useful instead of burying Creative in tickets nobody asked for.'},
    {tab:'upcoming',title:'Upcoming — an agenda, not a calendar grid',text:'Timeline becomes a simple month-grouped list (date · type · title), scoped to My Artists.'},
    {tab:'assets',title:'Assets — straight to the file',text:'A grid that deep-links to the final asset record. No separate hunting, no dead ends.'},
    {tab:'scheduling',title:'Scheduling — the pipeline plus the form',text:'Planning → Confirmed → GRPS in one view, with the intake form alongside. It also shows the split we’re proposing: scheduling keeps the Planning/Confirmed language; timeline notes don’t.'},
    {tab:'dsp-pitches',title:'DSP Pitches — misses float to the top',text:'A by-street-week queue that pins missing pitches first, with the pitch editor right beside the list.'},
    {tab:'artist-build-template',title:'Build notes everywhere',text:'This template strips the styling and maps every section to existing field names — and every page you just saw ends with its own build notes. Scroll to the bottom of any of them. That’s the tour — poke around.'}
  ];
  var card=document.getElementById('tcard'),tt=document.getElementById('tt'),ttx=document.getElementById('ttx'),
      ct=document.getElementById('tct'),bNext=document.getElementById('tnext'),bBack=document.getElementById('tback'),
      bX=document.getElementById('tx_close'),bOpen=document.getElementById('tourb'),i=0;
  function goTab(slug){var t=document.querySelector('.tab[data-page="'+slug+'"]');if(t&&!t.classList.contains('on'))t.click();}
  function render(){var s=steps[i];if(s.tab)goTab(s.tab);tt.textContent=s.title;ttx.textContent=s.text;
    ct.textContent=(i+1)+' of '+steps.length;bBack.style.visibility=i?'visible':'hidden';
    bNext.textContent=(i===steps.length-1)?'Done':'Next →';}
  function start(){i=0;card.classList.add('on');card.classList.remove('pulse');void card.offsetWidth;card.classList.add('pulse');render();}
  function stop(){card.classList.remove('on');try{localStorage.setItem('coPilotTourDone','1');}catch(e){}}
  bNext.addEventListener('click',function(){if(i<steps.length-1){i++;render();}else{stop();}});
  bBack.addEventListener('click',function(){if(i>0){i--;render();}});
  bX.addEventListener('click',stop);
  bOpen.addEventListener('click',start);
  var seen=false;try{seen=!!localStorage.getItem('coPilotTourDone');}catch(e){}
  if(!seen){setTimeout(start,900);}
})();
</script>
</body>
</html>
