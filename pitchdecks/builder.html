<!DOCTYPE html>
<html lang="en">
<head>
<link rel="stylesheet" href="/tempo.css">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deck Builder — Campaign Ops</title>
<link rel="icon" type="image/png" href="/logo_neon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  .db-wrap { max-width:1480px; margin:0 auto; padding:0 28px; }
  .db-head { padding:40px 0 24px; border-bottom:1px solid var(--border); }
  .db-kicker { font-size:11px; font-weight:600; letter-spacing:1.6px; text-transform:uppercase; color:var(--flame); margin-bottom:10px; }
  .db-head h1 { font-size:34px; font-weight:600; letter-spacing:-1px; line-height:1.1; margin:0 0 8px; }
  .db-sub { font-size:14px; color:var(--fog); max-width:70ch; line-height:1.6; }

  .db-bar { display:flex; flex-wrap:wrap; gap:10px; align-items:center; padding:16px 0; border-bottom:1px solid var(--border); }
  .db-bar input[type=text] { font:inherit; font-size:14px; padding:8px 12px; border:1px solid var(--rule); background:#fff; min-width:220px; color:var(--ink); }
  .db-btn { font:inherit; font-size:13px; font-weight:600; padding:8px 14px; border:1px solid var(--rule); background:#fff; color:var(--ink); cursor:pointer; white-space:nowrap; }
  .db-btn:hover { border-color:var(--ink); }
  .db-btn.pri { background:var(--ink); color:#fff; border-color:var(--ink); }
  .db-btn.pri:hover { background:#000; }
  .db-btn.lime { background:var(--lime); border-color:var(--lime); }
  .db-sp { flex:1; }
  .db-lbl { font-size:9px; font-weight:700; letter-spacing:1.5px; text-transform:uppercase; color:var(--fog); }
  .db-file { position:relative; overflow:hidden; }
  .db-file input { position:absolute; inset:0; opacity:0; cursor:pointer; }

  .db-grid { display:grid; grid-template-columns:280px 290px minmax(0,1fr); gap:24px; padding:22px 0 64px; align-items:start; }
  .db-col h2 { font-size:9px; font-weight:700; letter-spacing:1.5px; text-transform:uppercase; color:var(--fog); margin:0 0 10px; display:flex; justify-content:space-between; }
  .db-scroll { max-height:calc(100vh - 150px); overflow:auto; position:sticky; top:16px; }

  .lib-g { font-size:9px; font-weight:700; letter-spacing:1.5px; text-transform:uppercase; color:var(--lime-ink); margin:16px 0 6px; }
  .lib-g:first-child { margin-top:0; }
  .lib-i, .dk-i { display:flex; align-items:center; gap:8px; background:#fff; border:1px solid var(--border); padding:8px 10px; margin-bottom:-1px; font-size:13px; cursor:grab; user-select:none; }
  .lib-i:hover, .dk-i:hover { border-color:var(--ink); position:relative; z-index:1; }
  .lib-i .nm, .dk-i .nm { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .tag { font-size:8.5px; font-weight:700; letter-spacing:1px; text-transform:uppercase; padding:2px 5px; border:1px solid var(--rule); color:var(--fog); }
  .tag.empty { border-color:var(--flame); color:var(--flame); }
  .in-deck { width:6px; height:6px; border:1px solid transparent; flex:none; }
  .in-deck.on { background:var(--lime); border-color:var(--lime-ink); }
  .ico { font:inherit; background:none; border:0; color:var(--fog); cursor:pointer; padding:0 3px; font-size:14px; line-height:1; }
  .ico:hover { color:var(--ink); }

  .dk-list { min-height:320px; border:1px dashed var(--rule); padding:8px; background:var(--card-2); }
  .dk-list.over { border-color:var(--ink); }
  .dk-i .no { font-size:11px; font-weight:700; color:var(--fog); width:20px; font-variant-numeric:tabular-nums; }
  .dk-i.sel { border-color:var(--ink); box-shadow:inset 3px 0 0 var(--lime); position:relative; z-index:2; }
  .dk-i.dragging { opacity:.35; }
  .dk-ind { height:2px; background:var(--flame); margin:2px 0; }
  .dk-empty { color:var(--fog); font-size:13px; text-align:center; padding:110px 16px; line-height:1.6; }

  .pv-stage { position:relative; width:100%; background:#000; overflow:hidden; box-shadow:0 1px 0 var(--rule); }
  .pv-stage .sl { position:absolute; left:0; top:0; transform-origin:0 0; }
  .pv-meta { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-top:10px; font-size:12.5px; color:var(--fog); }
  .pv-none { aspect-ratio:16/9; display:flex; align-items:center; justify-content:center; color:var(--fog); border:1px dashed var(--rule); font-size:14px; }
  .sl [contenteditable]:hover { outline:2px dashed rgba(205,248,81,.55); outline-offset:6px; }
  .sl [contenteditable]:focus { outline:3px solid #CDF851; outline-offset:6px; }

  @media (max-width:1100px){ .db-grid{grid-template-columns:1fr 1fr;} .db-col.pv{grid-column:1/-1; order:-1;} .db-scroll{position:static; max-height:none;} }
  @media (max-width:700px){ .db-wrap{padding:0 16px;} .db-grid{grid-template-columns:1fr;} .db-head h1{font-size:28px;} }

  /* ── Present ── */
  #present { position:fixed; inset:0; background:#000; z-index:9999; display:none; cursor:none; }
  #present.on { display:block; }
  #present .sl { position:absolute; transform-origin:0 0; }
  #present .pc { position:absolute; right:18px; bottom:12px; color:#555; font:600 12px Inter,sans-serif; letter-spacing:1px; }
  #present:hover { cursor:default; }

  /* ── Slide system (1920×1080, RCA dark) ── */
  .sl { --k:1; width:1920px; height:1080px; background:#0F0E0E; color:#FCFDF8; font-family:Inter,Helvetica,Arial,sans-serif; position:relative; overflow:hidden; box-sizing:border-box; -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  .sl * { box-sizing:border-box; margin:0; }
  .sl .in { position:absolute; left:130px; right:130px; top:104px; bottom:120px; display:flex; flex-direction:column; overflow:hidden; }
  .sl .ft { position:absolute; left:130px; right:130px; bottom:48px; display:flex; justify-content:space-between; font-size:14px; font-weight:800; letter-spacing:.2em; text-transform:uppercase; color:#847D96; border-top:1px solid #2A2A2A; padding-top:18px; }
  .sl .ft b { color:#FCFDF8; font-weight:800; }
  .sl .kk { font-size:calc(18px*var(--k)); font-weight:800; letter-spacing:.2em; text-transform:uppercase; color:#CDF851; display:flex; gap:22px; align-items:center; }
  .sl .kk .x { color:#847D96; }
  .sl .hd { font-size:calc(76px*var(--k)); font-weight:800; letter-spacing:-.03em; line-height:1.02; margin-top:calc(26px*var(--k)); max-width:1660px; }
  .sl .ld { font-size:calc(30px*var(--k)); line-height:1.45; color:#B0A9BE; margin-top:calc(28px*var(--k)); max-width:1400px; font-weight:400; }
  .sl .ld.big { font-size:calc(42px*var(--k)); line-height:1.25; color:#FCFDF8; font-weight:600; letter-spacing:-.015em; max-width:1500px; }
  .sl .bd { font-size:calc(24px*var(--k)); line-height:1.55; color:#847D96; margin-top:calc(20px*var(--k)); max-width:1320px; }
  .sl .pl { display:grid; gap:calc(28px*var(--k)) 44px; margin-top:auto; padding-top:calc(44px*var(--k)); }
  .sl .pl > div { border-top:2px solid #CDF851; padding-top:calc(22px*var(--k)); }
  .sl .pl .pt { font-size:calc(30px*var(--k)); font-weight:700; letter-spacing:-.01em; line-height:1.2; }
  .sl .pl .pb { font-size:calc(22px*var(--k)); line-height:1.5; color:#B0A9BE; margin-top:calc(12px*var(--k)); }
  .sl .ch { display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-top:calc(36px*var(--k)); }
  .sl .ch .cl { font-size:calc(13px*var(--k)); font-weight:800; letter-spacing:.2em; text-transform:uppercase; color:#847D96; margin-right:10px; }
  .sl .ch span.c { font-size:calc(18px*var(--k)); font-weight:600; padding:8px 16px; border:1px solid #3E3F41; color:#FCFDF8; }
  .sl .gs { display:flex; gap:56px; margin-top:calc(46px*var(--k)); }
  .sl .gs > div { min-width:0; }
  .sl .gt { font-size:calc(15px*var(--k)); font-weight:800; letter-spacing:.2em; text-transform:uppercase; color:#CDF851; border-bottom:1px solid #2A2A2A; padding-bottom:12px; margin-bottom:calc(14px*var(--k)); }
  .sl .gs ul { list-style:none; padding:0; column-gap:36px; }
  .sl .gs li { font-size:calc(21px*var(--k)); line-height:1.3; padding:calc(6px*var(--k)) 0; break-inside:avoid; color:#FCFDF8; }
  .sl .gs li::before { content:''; display:inline-block; width:7px; height:7px; background:#CDF851; margin-right:12px; vertical-align:middle; position:relative; top:-2px; }
  .sl .gs .sub + .sub { margin-top:calc(28px*var(--k)); }
  /* section divider */
  .sl.section { background:#0F0E0E; }
  .sl.section .in { justify-content:center; }
  .sl.section .hd { font-size:calc(128px*var(--k)); letter-spacing:-.04em; line-height:.95; }
  .sl.section .bar { width:120px; height:10px; background:#CDF851; margin-bottom:40px; }
  /* title */
  .sl.title .in { right:auto; width:900px; justify-content:flex-end; }
  .sl.title .brand { font-size:calc(150px*var(--k)); font-weight:900; letter-spacing:-.05em; line-height:.88; }
  .sl.title .art { font-size:calc(96px*var(--k)); font-weight:800; letter-spacing:-.04em; line-height:1; color:#CDF851; margin-top:18px; }
  .sl.title .tg { font-size:calc(22px*var(--k)); font-weight:800; letter-spacing:.2em; text-transform:uppercase; color:#FCFDF8; margin-top:calc(48px*var(--k)); }
  .sl.title .ld { font-size:calc(24px*var(--k)); max-width:820px; }
  .sl.title .img { position:absolute; right:0; top:0; bottom:0; width:820px; background:#181818 center/cover no-repeat; display:flex; align-items:center; justify-content:center; }
  .sl.title .img .ph { border:2px dashed #3E3F41; color:#847D96; font-size:16px; font-weight:800; letter-spacing:.2em; text-transform:uppercase; padding:30px 40px; text-align:center; line-height:1.8; }
  .sl.title .ft { right:auto; width:900px; }
  /* timeline */
  .sl .tl { display:grid; grid-template-columns:repeat(3,1fr); gap:48px; margin-top:auto; padding-top:calc(40px*var(--k)); }
  .sl .tl .n { font-size:calc(15px*var(--k)); font-weight:800; letter-spacing:.2em; color:#0F0E0E; background:#CDF851; display:inline-block; padding:6px 12px; }
  .sl .tl .pt { font-size:calc(34px*var(--k)); font-weight:800; letter-spacing:-.02em; margin-top:calc(18px*var(--k)); }
  .sl .tl .pb { font-size:calc(22px*var(--k)); line-height:1.5; color:#B0A9BE; margin-top:calc(12px*var(--k)); }
  .sl .tl ul { list-style:none; padding:0; margin-top:calc(20px*var(--k)); border-top:1px solid #2A2A2A; padding-top:calc(14px*var(--k)); }
  .sl .tl li { font-size:calc(21px*var(--k)); line-height:1.4; padding:calc(5px*var(--k)) 0; }
  .sl .tl li::before { content:'—  '; color:#CDF851; }
  /* empty */
  .sl .pend { margin-top:auto; border:2px dashed #FF4A23; color:#FF4A23; padding:28px 34px; font-size:20px; font-weight:800; letter-spacing:.2em; text-transform:uppercase; align-self:flex-start; }
  /* closer */
  .sl.closer .in { justify-content:center; align-items:flex-start; }
  .sl.closer .hd { font-size:calc(140px*var(--k)); letter-spacing:-.045em; line-height:.92; }
  .sl.closer .hd em { font-style:normal; color:#CDF851; }

  #printRoot { position:fixed; left:-30000px; top:0; }
  @media print {
    @page { size:1920px 1080px; margin:0; }
    html, body { margin:0 !important; padding:0 !important; background:#0F0E0E !important; }
    body > *:not(#printRoot) { display:none !important; }
    #printRoot { position:static; }
    #printRoot .sl { page-break-after:always; break-after:page; }
    #printRoot .sl:last-child { page-break-after:auto; break-after:auto; }
  }
</style>
<script defer src="/shell.js"></script>
</head>
<body>
<div class="db-head"><div class="db-wrap">
  <div class="db-kicker">RCA Records · Pitch Deck System</div>
  <h1>Deck Builder</h1>
  <div class="db-sub">Drag sections into the deck, reorder, click any text in the preview to edit. Present in the browser or save as PDF. Drafts save in this browser only.</div>
</div></div>

<div class="db-wrap">
  <div class="db-bar">
    <input type="text" id="artist" placeholder="Artist name" aria-label="Artist name">
    <label class="db-btn db-file">Cover image<input type="file" id="img" accept="image/*"></label>
    <button class="db-btn" id="imgClear" hidden>Remove image</button>
    <span class="db-sp"></span>
    <span class="db-lbl">Start from</span>
    <button class="db-btn" data-preset="full">Full deck</button>
    <button class="db-btn" data-preset="short">Short pitch</button>
    <button class="db-btn" data-preset="clear">Blank</button>
    <button class="db-btn lime" id="pdf">Save PDF</button>
    <button class="db-btn pri" id="present-btn">Present ▸</button>
  </div>

  <div class="db-grid">
    <div class="db-col"><div class="db-scroll">
      <h2><span>Section library</span><span id="libCount"></span></h2>
      <div id="lib"></div>
    </div></div>
    <div class="db-col"><div class="db-scroll">
      <h2><span>Your deck</span><span id="dkCount"></span></h2>
      <div class="dk-list" id="deck"></div>
    </div></div>
    <div class="db-col pv">
      <h2><span>Preview</span><span id="pvName"></span></h2>
      <div id="pv"></div>
      <div class="pv-meta"><span id="pvHint">Click text to edit.</span><button class="db-btn" id="resetSlide" hidden>Reset this slide's edits</button></div>
    </div>
  </div>
</div>

<div id="present"><div class="pc" id="pc"></div></div>
<div id="printRoot"></div>

  var artist = (S.artist || '').trim(), h = '';

    h = '<div class="in"><div class="kk">' + T('span','','kicker') + '</div>' + T('div','hd','headline').replace('class="hd"','class="hd" style="font-size:calc(56px*var(--k))"') + '<div class="gs">' + gs + '</div></div>';

function fit(sl){
  var inn = sl.querySelector('.in'); if (!inn) return;
  var k = sl.classList.contains('lists') ? 1.4 : 1; sl.style.setProperty('--k', k);
  while (inn.scrollHeight > inn.clientHeight + 1 && k > 0.62){ k = +(k - 0.03).toFixed(2); sl.style.setProperty('--k', k); }
}

/* ── Library ── */
function drawLib(){
  var inDeck = {}; S.items.forEach(function(i){ inDeck[i.id] = 1; });
  var html = '', g = '';
  LIB.forEach(function(s){
    if (s.g !== g){ g = s.g; html += '<div class="lib-g">' + esc(g) + '</div>'; }
    html += '<div class="lib-i" draggable="true" data-id="' + s.id + '">' +
      '<span class="in-deck' + (inDeck[s.id] ? ' on" title="In deck"' : '"') + '></span>' +
      '<span class="nm">' + esc(s.name) + '</span>' +
      (s.empty ? '<span class="tag empty">Empty</span>' : '') + (s.ref ? '<span class="tag" title="From the Reference Doc tab">Ref</span>' : '') +
      '<button class="ico" data-add="' + s.id + '" title="Add to deck" aria-label="Add ' + esc(s.name) + '">+</button></div>';
  });
  document.getElementById('lib').innerHTML = html;
  document.getElementById('libCount').textContent = LIB.length;
}

/* ── Deck list ── */
function drawDeck(){
  var el = document.getElementById('deck');
  if (!S.items.length){ el.innerHTML = '<div class="dk-empty">Drag sections here<br>or pick a starting point above.</div>'; }
  else el.innerHTML = S.items.map(function(it, i){
    var s = BY[it.id], edited = it.ov && Object.keys(it.ov).length;
    return '<div class="dk-i' + (it.uid === S.sel ? ' sel' : '') + '" draggable="true" data-uid="' + it.uid + '">' +
      '<span class="no">' + (i+1) + '</span><span class="nm">' + esc(s.name) + '</span>' +
      (edited ? '<span class="tag" title="Text edited">Edited</span>' : '') + (s.empty ? '<span class="tag empty">Empty</span>' : '') +
      '<button class="ico" data-mv="-1" title="Move up" aria-label="Move up">↑</button><button class="ico" data-mv="1" title="Move down" aria-label="Move down">↓</button>' +
      '<button class="ico" data-rm="1" title="Remove" aria-label="Remove">×</button></div>';
  }).join('');
  document.getElementById('dkCount').textContent = S.items.length ? S.items.length + ' slides' : '';
}

/* ── Preview ── */
var pvScale = 1;
function drawPreview(){
  var pv = document.getElementById('pv'), idx = S.items.findIndex(function(i){ return i.uid === S.sel; });
  var reset = document.getElementById('resetSlide');
  if (idx < 0){ pv.innerHTML = '<div class="pv-none">Select a slide in your deck</div>'; document.getElementById('pvName').textContent = ''; reset.hidden = true; return; }
  var it = S.items[idx];
  pv.innerHTML = '<div class="pv-stage" id="stage">' + renderSlide(it, idx+1, S.items.length, true) + '</div>';
  document.getElementById('pvName').textContent = BY[it.id].name;
  reset.hidden = !(it.ov && Object.keys(it.ov).length);
  sizePreview();
  fit(pv.querySelector('.sl'));
}
function sizePreview(){
  var st = document.getElementById('stage'); if (!st) return;
  var w = st.clientWidth; pvScale = w / 1920; st.style.height = (w * 1080/1920) + 'px';
  var sl = st.querySelector('.sl'); if (sl) sl.style.transform = 'scale(' + pvScale + ')';
}
function drawAll(){ drawLib(); drawDeck(); drawPreview(); save(); }

/* ── Actions ── */
function setPreset(name, silent){
  if (!silent && S.items.some(function(i){ return i.ov && Object.keys(i.ov).length; }) && !confirm('Replace the current deck? Text edits will be lost.')) return;
  S.items = PRESETS[name].map(function(id){ return { uid:uid(), id:id, ov:{} }; });
  S.sel = S.items[0] ? S.items[0].uid : null;
  if (!silent) drawAll();
}
function addAt(id, at){
  var it = { uid:uid(), id:id, ov:{} };
  if (at == null || at > S.items.length) at = S.items.length;
  S.items.splice(at, 0, it); S.sel = it.uid; drawAll();
  var row = document.querySelector('.dk-i[data-uid="' + it.uid + '"]'); if (row) row.scrollIntoView({block:'nearest'});
}
function moveTo(u, at){
  var from = S.items.findIndex(function(i){ return i.uid === u; }); if (from < 0) return;
  var it = S.items.splice(from, 1)[0]; if (at > from) at--; S.items.splice(at, 0, it); drawAll();
}

document.getElementById('lib').addEventListener('click', function(e){
  var b = e.target.closest('[data-add]'); if (b){ addAt(b.getAttribute('data-add')); return; }
});

});
document.getElementById('deck').addEventListener('click', function(e){
  var row = e.target.closest('.dk-i'); if (!row) return;
  var u = row.getAttribute('data-uid'), idx = S.items.findIndex(function(i){ return i.uid === u; });
  if (e.target.closest('[data-rm]')){
    var it = S.items[idx];
    if (it.ov && Object.keys(it.ov).length && !confirm('Remove this slide and its text edits?')) return;
    S.items.splice(idx, 1);
    if (S.sel === u) S.sel = S.items[Math.min(idx, S.items.length-1)] ? S.items[Math.min(idx, S.items.length-1)].uid : null;
    drawAll(); return;
  }
  var mv = e.target.closest('[data-mv]');
  if (mv){ var d = +mv.getAttribute('data-mv'), to = idx + d; if (to < 0 || to >= S.items.length) return;
    var t = S.items[idx]; S.items[idx] = S.items[to]; S.items[to] = t; drawAll(); return; }

/* drag & drop */

    var im = new Image(); im.onload = function(){
      var c = document.createElement('canvas'), sc = Math.min(1, 1600 / Math.max(im.width, im.height));
      c.width = Math.round(im.width*sc); c.height = Math.round(im.height*sc);
      c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
      IMG = c.toDataURL('image/jpeg', .85);
      try { localStorage.setItem(IKEY, IMG); } catch(x){}
      document.getElementById('imgClear').hidden = false;
      if (!S.items.some(function(i){ return i.id === 'title'; })) addAt('title', 0); else drawPreview();
    }; im.src = r.result;
  };
  r.readAsDataURL(f); e.target.value = '';
});
document.getElementById('imgClear').addEventListener('click', function(){ IMG = ''; try { localStorage.removeItem(IKEY); } catch(x){} this.hidden = true; drawPreview(); });
[].forEach.call(document.querySelectorAll('[data-preset]'), function(b){ b.addEventListener('click', function(){ setPreset(b.getAttribute('data-preset')); }); });

/* present */
var P = { on:false, i:0 };
function presentDraw(){
  var box = document.getElementById('present'), it = S.items[P.i];
  var old = box.querySelector('.sl'); if (old) old.remove();
  box.insertAdjacentHTML('afterbegin', renderSlide(it, P.i+1, S.items.length, false));
  var sl = box.querySelector('.sl'), sc = Math.min(innerWidth/1920, innerHeight/1080);
  sl.style.transform = 'scale(' + sc + ')'; sl.style.left = ((innerWidth - 1920*sc)/2) + 'px'; sl.style.top = ((innerHeight - 1080*sc)/2) + 'px';
  fit(sl);
  document.getElementById('pc').textContent = (P.i+1) + ' / ' + S.items.length + '   ·   ← → to move, Esc to exit';
}
function presentOpen(){
  if (!S.items.length) return;
  var idx = S.items.findIndex(function(i){ return i.uid === S.sel; });
  P.on = true; P.i = Math.max(0, idx);
  document.getElementById('present').classList.add('on'); presentDraw();
  var de = document.documentElement; if (de.requestFullscreen) de.requestFullscreen().catch(function(){});
}
function presentClose(){
  P.on = false; document.getElementById('present').classList.remove('on');
  if (document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(function(){});
  S.sel = S.items[P.i] ? S.items[P.i].uid : S.sel; drawDeck(); drawPreview(); save();
}
function go(d){ var n = P.i + d; if (n < 0 || n >= S.items.length) return; P.i = n; presentDraw(); }
document.getElementById('present-btn').addEventListener('click', presentOpen);
document.getElementById('present').addEventListener('click', function(e){ go(e.clientX < innerWidth/3 ? -1 : 1); });
document.addEventListener('keydown', function(e){
  if (!P.on) return;
  if (['ArrowRight','ArrowDown','PageDown',' ','Enter'].indexOf(e.key) > -1){ e.preventDefault(); go(1); }
  else if (['ArrowLeft','ArrowUp','PageUp','Backspace'].indexOf(e.key) > -1){ e.preventDefault(); go(-1); }
  else if (e.key === 'Home'){ P.i = 0; presentDraw(); }
  else if (e.key === 'End'){ P.i = S.items.length-1; presentDraw(); }
  else if (e.key === 'Escape'){ presentClose(); }
});
document.addEventListener('fullscreenchange', function(){ if (!document.fullscreenElement && P.on) presentClose(); });

/* PDF */
function buildPrint(){
  var pr = document.getElementById('printRoot');
  pr.innerHTML = S.items.map(function(it, i){ return renderSlide(it, i+1, S.items.length, false); }).join('');
  [].forEach.call(pr.querySelectorAll('.sl'), fit);
}
document.getElementById('pdf').addEventListener('click', function(){
  if (!S.items.length) return;
  buildPrint();
  var t = document.title; document.title = 'RCA Records' + (S.artist ? ' x ' + S.artist : '') + ' — Pitch Deck';
  setTimeout(function(){ window.print(); document.title = t; }, 60);
});
window.addEventListener('beforeprint', function(){ if (!document.getElementById('printRoot').children.length) buildPrint(); });
window.addEventListener('afterprint', function(){ document.getElementById('printRoot').innerHTML = ''; });

window.addEventListener('resize', function(){ sizePreview(); if (P.on) presentDraw(); });

load();
artistEl.value = S.artist || '';
if (IMG) document.getElementById('imgClear').hidden = false;
if (!S.sel && S.items[0]) S.sel = S.items[0].uid;
drawAll();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(drawPreview);
</script>
</body>
